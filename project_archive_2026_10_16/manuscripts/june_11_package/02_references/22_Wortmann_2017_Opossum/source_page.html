<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification - CumInCAD Computer Aided Architectural Design Research Papers</title>
    <link href="/css/style.css" rel="stylesheet" type="text/css">
    <link rel="shortcut icon" href="https://papers.cumincad.org/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: "Dosis", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            min-height: 100vh;
        }

        .verification-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .header-logo {
            padding-top: 5%;
            padding-bottom: 3%;
        }

        .header-logo img {
            max-width: 100%;
            height: auto;
        }

        .verification-main {
            background: #f9f9f9;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px;
            margin: 20px auto;
            max-width: 600px;
            box-shadow: 0px 4px 8px 0px rgba(0,0,0,0.1);
        }

        .verification-title {
            color: #333333;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 20px;
            border-bottom: 2px solid #ec4e20;
            padding-bottom: 10px;
        }

        .explanation {
            color: #333333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: left;
        }

        .verification-form {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            padding: 30px;
            margin: 25px 0;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            font-size: 18px;
        }

        .human-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
            transform: scale(1.3);
        }

        .checkbox-label {
            color: #333333;
            cursor: pointer;
            user-select: none;
            font-weight: 400;
        }

        .verify-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-family: "Dosis", sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            min-width: 250px;
            font-weight: 500;
        }

        .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .verify-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .footer-links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
        }

        .footer-links a {
            color: #ec4e20;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="header-logo">
            <img src="/img/CumInCAD.png" alt="CumInCAD - Computer Aided Architectural Design Research Papers" />
        </div>

        <div class="verification-main">
            <h1 class="verification-title">Verification Required</h1>

            <div class="explanation">
                <p>To protect our academic resources from automated bots and ensure optimal performance for researchers worldwide, we need to verify one time that you're a human visitor.</p>
            </div>

            <div class="verification-form">
                <form method="POST" action="/verify-human.php" id="verifyForm">
                    <div class="checkbox-container">
                        <input type="checkbox" id="humanCheck" class="human-checkbox" name="human_verified" value="1" required>
                        <label for="humanCheck" class="checkbox-label">✓ Click to verify</label>
                    </div>

                    <input type="hidden" name="return_url" value="/cgi-bin/works/paper/caadria2017_124">
                    <input type="hidden" name="verification_token" value="00ec4f48882f3910b3940f3b47493cd9">
                </form>
            </div>

            <div class="footer-links">
                <a href="/about.html">About CumInCAD</a>
                <a href="/helpdesk/">Help Desk</a>
                <a href="/cgi-bin/works/SearchForm">Advanced Search</a>
            </div>
        </div>
    </div>

    <script>
        // Auto-submit form when checkbox is clicked
        document.getElementById('humanCheck').addEventListener('change', function() {
            if (this.checked) {
                document.getElementById('verifyForm').submit();
            }
        });
    </script>
</body>
</html>
